[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroegress"
version = "0.1.0"
description = "Local-only AI for confidential documents: socket-level egress jail, sensitivity gate, per-client encrypted vaults, client-auditable trust pack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aamir Malik Zameer" }]
keywords = ["privacy", "local-llm", "ollama", "confidential", "tender", "bid", "nda", "air-gap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
zeroegress = "zeroegress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
