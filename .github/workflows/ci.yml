name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Install gpg (vault tests)
        run: sudo apt-get update -qq && sudo apt-get install -y gnupg
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          zeroegress --version
          zeroegress status
          printf 'Q3 pricing for Client X: total SAR 1,250,000\n' | zeroegress gate - ; test $? -le 11
